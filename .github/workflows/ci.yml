name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Unit, API, JS lint and browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails if pyproject.toml and uv.lock disagree (the Docker image installs --frozen).
      - run: uv lock --check
      - run: uv sync --dev
      - run: uv run playwright install --with-deps chromium
      # Includes tests/e2e against the real server (headless Chromium; fails on any
      # browser console/page error or failed API call) and tests/test_js_static.py.
      - run: uv run pytest -q
      # The same browser tests against the GitHub Pages build (Python running in the
      # browser under Pyodide).
      - run: uv run pytest tests/e2e -q
        env:
          FILEFOLD_E2E_TARGET: static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-output
          path: |
            test-results/
          if-no-files-found: ignore

  # The production path (Railway or any container host) must keep working even while the
  # app is served as a static site from GitHub Pages during development.
  docker:
    name: Production image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/docker_smoke.sh filefold:ci
