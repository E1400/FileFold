name: Build Desktop App

on:
  push:
    tags:
      - "v*"          # trigger on version tags: v0.1.0, v1.0.0, etc.
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FileFold-macOS.zip
          - os: windows-latest
            artifact: FileFold-Windows.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra desktop

      - name: Generate icons (macOS)
        if: runner.os == 'macOS'
        run: uv run python build/make_icons.py

      - name: Generate icons (Windows)
        if: runner.os == 'Windows'
        run: uv run python build/make_icons.py

      - name: Build with PyInstaller
        run: uv run pyinstaller filefold.spec --clean

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }} FileFold.app

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\FileFold -DestinationPath ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FileFold-macOS.zip/FileFold-macOS.zip
            FileFold-Windows.zip/FileFold-Windows.zip
          generate_release_notes: true
